[project]
name = "behique"
version = "0.1.0"
description = "Local-first RAG over your own folders: hybrid search, REST API, MCP and agentic /ask."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
    "tree-sitter-language-pack>=1.22.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behique"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
